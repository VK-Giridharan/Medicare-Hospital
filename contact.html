<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | NS Kumudham Hospital</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

:root{
--primary:#009688;
--secondary:#004d40;
--light:#f4f9f9;
--shadow:0 10px 30px rgba(0,0,0,0.08);
}

body{
font-family:'Roboto',sans-serif;
background:var(--light);
margin:0;
}

/* ===== HEADER (FIXED SAME AS INDEX) ===== */

.header{
position:fixed;
top:0;
width:100%;
background:white;
z-index:1000;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:18px 6%;
}

.logo{
display:flex;
align-items:center;
font-family:'Poppins',sans-serif;
font-size:1.7rem;
font-weight:700;
color:var(--primary);
gap:10px;
text-decoration: none;
}

.logo-img {
width: 55px;
height: 55px;
object-fit: cover;
border-radius: 8px;
}

.logo-text {
  display: flex;
  align-items: center;
  gap: 5px;
}

.logo-ns {
  font-size: 1.7rem;
  font-weight: 700;
}

.logo-right {
  display: flex;
  gap: 5px;
}

.logo-top,
.logo-bottom {
  font-size: 1.7rem;
}

.logo i{
color:#e63946;
font-size:1.6rem;
}

.nav-menu{
display:flex;
align-items:center;
gap:35px;
list-style:none;
margin:0;
}

.nav-link{
position:relative;
font-weight:500;
font-size:1rem;
color:#333;
text-decoration:none;
padding-bottom:5px;
transition:.3s;
}

/* Desktop icons hide */
.nav-link i{
display: none;
}

.nav-link::after{
content:"";
position:absolute;
left:0;
bottom:0;
width:0%;
height:2px;
background:var(--primary);
transition:.3s;
}

.nav-link:hover{
color:var(--primary);
}

.nav-link:hover::after{
width:100%;
}

/* ❌ REMOVE PERMANENT UNDERLINE */
.nav-link.active{
color: var(--primary);
}

.nav-link.active::after{
width: 0%;
}

/* MOBILE */

.hamburger{
display:none;
cursor:pointer;
}

.bar{
width:25px;
height:3px;
background:#333;
margin:5px;
}

@media(max-width:768px){

  .logo-text {
  display: flex;
  align-items: center;
}

.logo-ns {
  font-size: 2.3rem;
  font-weight: 700;/* BIG NS */
}

.logo-right {
  display: flex;
  flex-direction: column; /* Kumudham ↓ Hospital */
  line-height: 1.1;
  margin-left: 4px;
}

.logo-top,
.logo-bottom {
  font-size: 0.85rem;
}

         .nav-menu {
position: fixed;
top: 80px;
left: -100%;
flex-direction: column;
background: white;
width: 60%;
height: 100vh;
padding: 30px;
gap: 20px;
transition: .3s;
box-shadow: 0 0 20px rgba(0,0,0,0.1);
}


.nav-menu li{
    width:100%;
}

.nav-link{
    display:flex;
    align-items:center;
    width:100%;
    padding:0px 0px; /* ✅ PERFECT LINK SPACING */
}

.hamburger{
display:block;
}

/* Mobile Icons */
.nav-link i{
display: inline-block;
margin-right: 10px;
color: var(--primary);
}

.nav-menu.active{
left:0;
}

}

/* ===== PAGE ===== */

.page-container{
margin-top:120px;
padding-bottom:40px;
}

/* ===== FORM CARD ===== */

.form-card{
background:white;
padding:30px;
border-radius:15px;
box-shadow:var(--shadow);
transition:.3s;
}

.form-card:hover{
transform:translateY(-5px);
}

/* INPUT */

.form-control, .form-select{
border-radius:8px;
padding:10px;
transition:.3s;
}

.form-control:focus, .form-select:focus{
border-color:var(--primary);
box-shadow:0 0 0 2px rgba(0,150,136,0.2);
}

/* BUTTON */

.btn-submit{
background:var(--primary);
color:white;
padding:10px 25px;
border:none;
border-radius:6px;
transition:.3s;
}

.btn-submit:hover{
background:var(--secondary);
transform:scale(1.05);
}

/* ===== CONTACT INFO CARD ===== */

.info-card{
background:white;
padding:25px;
border-radius:15px;
box-shadow:var(--shadow);
transition:.3s;
}

.info-card:hover{
transform:translateY(-5px);
}

.info-card i{
color:var(--primary);
margin-right:10px;
}

/* SOCIAL */

.social-icons a{
font-size:22px;
margin-right:15px;
color:var(--primary);
transition:.3s;
}

.social-icons a:hover{
color:var(--secondary);
transform:scale(1.2);
}

/* MAP */

.map-box{
border-radius:15px;
overflow:hidden;
box-shadow:var(--shadow);
margin-top:20px;
}

</style>

</head>

<body>

    <div class="logo-right">
      <span class="logo-top">Kumudham</span>

    </div>
  </div>
</a>

<ul class="nav-menu">

<li><a href="index.html" class="nav-link"><i class="fas fa-home"></i>Home</a></li>
<li><a href="specialities.html" class="nav-link"><i class="fas fa-stethoscope"></i>Specialities</a></li>

<li><a href="departments.html" class="nav-link"><i class="fas fa-building"></i>Departments</a></li>
<li><a href="about.html" class="nav-link"><i class="fas fa-users"></i>About Us</a></li>
<li><a href="Contact.html" class="nav-link active"><i class="fas fa-phone"></i>Contact</a></li>

</ul>

<div class="hamburger">

<div class="bar"></div>

<!-- PAGE -->

<div class="container page-container">

<div class="row g-4">

<!-- FORM -->

<div class="col-lg-7">

    <div class="form-card">
        <h4 class="mb-4 text-primary">Fill The Details</h4>

        <form onsubmit="sendMail(event)">

            <div class="mb-3">
                <label>Name</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Mobile</label>
                <input type="text" id="mobile" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Message</label>
                <textarea id="message" class="form-control" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn-submit">Send Message</button>

        </form>
    </div>

</div>

<script>
function sendMail(e) {
    e.preventDefault();

    var name = document.getElementById("name").value;
    var email = document.getElementById("email").value;
    var mobile = document.getElementById("mobile").value;
    var message = document.getElementById("message").value;

    var subject = "New Contact Form Message";

    var body = "Name: " + name + "%0D%0A"
             + "Email: " + email + "%0D%0A"
             + "Mobile: " + mobile + "%0D%0A"
             + "Message: " + message;

    var mailtoLink = "mailto:drselvikumudhamhos@gmail.com"
                   + "?subject=" + subject
                   + "&body=" + body;

    window.location.href = mailtoLink;
}
</script>

    width="100%"

</div>

</div>

<script>

const hamburger=document.querySelector(".hamburger");
const navMenu=document.querySelector(".nav-menu");

hamburger.addEventListener("click",()=>{
navMenu.classList.toggle("active");
});

document.querySelectorAll(".nav-link").forEach(link=>{
link.addEventListener("click",()=>{
navMenu.classList.remove("active");
});
});

</script>
